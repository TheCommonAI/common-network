[build]
  publish = "public"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Serves the board under /admin-mes on any domain that points at this site.
[[redirects]]
  from = "/admin-mes/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/admin-mes/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
