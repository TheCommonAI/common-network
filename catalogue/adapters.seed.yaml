    base_model: "Qwen/Qwen2.5-1.5B-Instruct"
    blend_group: "qwen2.5-1.5b-r16-a32-7t"
    domain_text: >-
      arithmetic word problems: unit prices, percentage discounts, speed and
      distance, averages and ratio sharing, worked through to one numeric answer
    domain_tags: ["math", "arithmetic", "word-problems"]
    size_mb: 71
    min_ram_gb: 2
    licence: null
    gguf_ref: null

