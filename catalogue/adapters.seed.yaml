# Common Network adapter catalogue — what the network can fuse, not install.
#
# This file is the SOURCE OF TRUTH for which LoRA adapters the gateway may
# recommend, exactly as catalogue.seed.yaml is for models. An entry removed from
# here is deleted from the gateway on next boot (see seed_adapters_from_file).
# Separate file and separate table on purpose: the catalogue seeder ends in a
# `delete ... where id <> all(...)`, so an adapter stored in catalogue_models
# would be wiped the first time somebody trimmed *that* file.
#
# This is a commons asset — PRs welcome. Add adapters you have actually
# verified: `revision` pinned to a commit you read the adapter_config.json at,
# `base_model` the exact repo the adapter was fitted against, and `size_mb` the
# real weight file. A recommendation here becomes a build on somebody's laptop.
#
# --- WHAT THIS LIST IS FOR -------------------------------------------------
#
# When requests cluster somewhere no node covers, the gateway names the nearest
# adapters so a node on the matching base can average them into a specialist
# locally. Nobody trains anything and nothing is downloaded by the gateway.
#
# --- THE TWO FIELDS THAT DECIDE WHAT CAN BE FUSED TOGETHER -----------------
#
# `base_model` — the weights the adapter was fitted against, as a Hugging Face
# repo id. A LoRA on the wrong base is not a weak recommendation, it is an
# invalid one, so this is NOT NULL in the table and every recommendation is
# filtered on it. Nodes report their base in this same namespace; note that
# catalogue_models.base_model uses a different one ('ollama:*' pull-names), and
# app/adapters.py keeps the two apart rather than comparing them.
#
# `blend_group` — which adapters may be averaged *together*. LoraHub-style
# fusion sums the A and B matrices across adapters and multiplies the sums,
# which is only a LoRA at all if every member agrees on r, lora_alpha and target
# modules. A shared label is that agreement, stated once instead of re-derived
# per query. NULL means "blends with nothing": the adapter can be recommended
# alone, and never as one of a pair.
#
# All six of the Qwen2.5-1.5B-Instruct adapters below are r=16, alpha=32, 7
# targets (q,k,v,o,gate,up,down_proj) and share one group. The medical adapter
# is r=64, alpha=16, 4 targets and cannot join them — recorded as such rather
# than left to be discovered by a failed build.
#
# --- `domain_text` IS LOAD-BEARING, SO BE SPECIFIC -------------------------
#
# It is what gets embedded and compared against a demand cluster's centroid, so
# it decides which adapters are recommended for a region. A vague profile
# ("good at maths and reasoning") sits near everything and will be chosen for
# everything. Name the actual subject matter.
#
# Measured evidence that this matters, 7 synthetic demands against these seven
# profiles: with generic one-line profiles, math-12k was the nearest adapter for
# *five of seven* unrelated demands including beekeeping and translation. The
# wording below is topical on purpose. It is not calibrated and should be
# re-measured against real demand before any threshold here is trusted.
#
# --- TWO THINGS TO KNOW BEFORE ADDING AN ENTRY -----------------------------
#
# `gguf_ref` is NULL for everything below, and that is the honest state of the
# ecosystem rather than an omission. Ollama's ADAPTER directive takes a PEFT
# directory or a GGUF, but its safetensors adapter support is documented for the
# Llama, Mistral and Gemma families — Qwen is not among them. Every adapter here
# is on Qwen2.5. So the reliable path is a GGUF converted with llama.cpp's
# convert_lora_to_gguf.py, and no GGUF of these has been published. A NULL means
# the operator converts before building; the CLI says so rather than failing
# obscurely. Set gguf_ref only when you have checked one actually resolves.
#
# `licence` is NULL for everything below because it was not verified — not
# because it is permissive. The seven repos' licence metadata was not read when
# these were added. NULL means unverified: check before redistributing a fused
# model, and fill this in when you do.
#
# --- WHAT HAS ACTUALLY BEEN MEASURED --------------------------------------
#
# One thing: experiments/lora-blend, a 50-question maths word-problem
# experiment blending three of these on Qwen2.5-1.5B-Instruct. Read its README
# before quoting any number from it. It does *not* establish that a fusion
# recommended here answers better than the base — the weights it searched for
# are not the uniform weights this path would use, and it says so itself. The
# claim this list supports is that the network *can* build a specialist on
# demand. Not that the specialist is better.

base_model: "Qwen/Qwen2.5-1.5B-Instruct"

adapters:
