# Common Network specialist catalogue.
#
# This file is the SOURCE OF TRUTH for what the network will auto-install on
# a machine that runs `common join`. An entry removed from here is deleted
# from the gateway on next boot (see seed_catalogue_from_file) -- it is not
# merely hidden, so a node can never be assigned a model that isn't listed.
#
# This is a commons asset — PRs welcome. Add real, runnable models only.
# Every `source: ollama:*` tag below was verified to resolve against
# registry.ollama.ai before being added; a tag that 404s would fail the
# pull on every machine assigned to it.
#
# `verified_in_lane: true` is earned by the benchmark harness (bench/)
# actually measuring a model beating a frontier model in its domain — never
# set it because a model "should" be good. See `lane_benchmark` for the
# measurement that earned it, and its `date`.
#
# min_ram_gb / min_vram_gb / needs_gpu gate what common-join will ever
# recommend for a given machine — leave real headroom, a specialist that
# swaps and times out is worse than a generalist that answers. The figures
# below are the measured download size plus room for KV cache and the OS;
# common-join additionally applies a 0.8 headroom factor on top.
#
# --- WHAT CHANGED IN v0.1.1, AND WHY -------------------------------------
#
# v0.1's catalogue was five general-purpose models and one API entry. Five
# generalists cannot compose: the whole finding of `testing/seam-findings.md`
# §2 is that combining models only pays when neither is dominated by the
# other, and near-identical generalists dominate each other by turns on noise.
# A catalogue of generalists guarantees the network can never beat its own
# best node, no matter how many machines join.
#
# So this catalogue is now built around *narrow* specialists — models that are
# clearly worse than a generalist at most things and clearly better at one.
# That is an uncomfortable-looking selection rule, and it is the correct one:
# a panel needs members who are each best at something, not members who are
# each pretty good at everything.
#
# The pre-flight in seam-findings.md §3 concluded no viable specialist pair
# existed, having searched all 411 OpenRouter model IDs and found zero
# maths-tuned models. That conclusion is true of OpenRouter and false of the
# actual world: `mathstral`, `phi4-mini-reasoning`, `sqlcoder`, `starcoder2`,
# `meditron` and `openthinker` all resolve on registry.ollama.ai today, and
# were each checked before being listed here. Narrow specialists are
# unprofitable to host as a hosted API and free to host on donated hardware —
# which is the network's thesis, arriving as a practical consequence.

models:
  # --- Maths and quantitative reasoning ---------------------------------
  #
  # The lane where the seam findings measured the largest failure (numeric
  # precision: 0.719 before the handoff, 0.344 after) and the largest recovery
  # (+0.203 from receiver-side re-derivation). It is also the lane where a
  # small specialist most clearly beat a much larger generalist: 0.808 for an
  # 8B reasoning-tuned model against 0.615 for a 70-72B general one.

  - id: mathstral-7b
    display_name: Mathstral 7B
    source: "ollama:mathstral:7b"
    domain_tags: [math, arithmetic, word-problems, quantitative]
    capability_text: >
      Mathstral 7B. A Mistral model tuned specifically for mathematical and
      scientific reasoning — arithmetic, algebra, multi-step word problems and
      quantitative analysis. Narrow by design: weaker than a general model at
      conversation and writing, stronger at calculation.
    params_b: 7.2
    min_ram_gb: 8
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: apache-2.0

  - id: phi4-mini-reasoning
    display_name: Phi-4 Mini Reasoning
    source: "ollama:phi4-mini-reasoning:latest"
    domain_tags: [math, reasoning, logic, step-by-step]
    capability_text: >
      Phi-4 Mini Reasoning. Distilled for explicit step-by-step mathematical
      and logical reasoning at a very small footprint. Shows its working, which
      makes its arithmetic independently checkable by the gateway's verifier.
    params_b: 3.8
    min_ram_gb: 6
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: mit

  - id: deepseek-r1-14b
    display_name: DeepSeek-R1 14B
    source: "ollama:deepseek-r1:14b"
    domain_tags: [reasoning, logic, math, planning]
    capability_text: >
      DeepSeek-R1 14B. Explicit chain-of-thought reasoning model — works
      step by step through logic puzzles, multi-stage problems and planning
      tasks rather than answering in one pass. The heaviest reasoning
      specialist in the catalogue.
    params_b: 14.8
    min_ram_gb: 16
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: mit

  # --- Code -------------------------------------------------------------
  #
  # Three entries at different footprints rather than one, because a school
  # lab is heterogeneous: an 8GB machine and a 16GB machine should both be
  # able to serve code, at different depths.

  - id: qwen2.5-coder-7b
    display_name: Qwen2.5 Coder 7B
    source: "ollama:qwen2.5-coder:7b"
    domain_tags: [code, programming, debugging]
    capability_text: >
      Qwen2.5 Coder 7B. Code generation, debugging and multi-file reasoning
      across common languages. The default programming specialist — fits a
      machine that cannot hold the 14B.
    params_b: 7.6
    min_ram_gb: 8
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: apache-2.0

  - id: qwen2.5-coder-14b
    display_name: Qwen2.5 Coder 14B
    source: "ollama:qwen2.5-coder:14b"
    domain_tags: [code, programming, debugging]
    capability_text: >
      Qwen2.5 Coder 14B. Code generation, debugging, and multi-file
      reasoning across common languages. The network's deepest programming
      specialist.
    params_b: 14.8
    min_ram_gb: 16
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: apache-2.0

  - id: sqlcoder-7b
    display_name: SQLCoder 7B
    source: "ollama:sqlcoder:7b"
    domain_tags: [sql, databases, queries]
    capability_text: >
      SQLCoder 7B. Translates plain-English questions into SQL against a given
      schema. Extremely narrow — it does essentially nothing else, and beats
      general models of any size at the one thing it does.
    params_b: 7.0
    min_ram_gb: 8
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: cc-by-sa-4.0

  # --- Legal ------------------------------------------------------------
