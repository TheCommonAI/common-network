  # --- Medicine ---------------------------------------------------------
  #
  # Listed because the lane is real and no generalist covers it safely, NOT
  # because these models are good. Both are old and weak. They are here as
  # honest placeholders for a domain the network should cover, and neither is
  # verified_in_lane. Treat any answer as a research artifact.

  - id: meditron-7b
    display_name: Meditron 7B
    source: "ollama:meditron:7b"
    domain_tags: [medical, clinical, biomedical]
    capability_text: >
      Meditron 7B. Llama-2 adapted on biomedical literature and clinical
      guidelines. Research use only — not clinically validated, not a source
      of medical advice, and older than most of this catalogue.
    params_b: 7.0
    min_ram_gb: 8
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: llama2

  # --- Generalists ------------------------------------------------------
  #
  # Still needed, for two jobs neither of which is being on a panel:
  #   1. answering requests that don't span domains (most of them), and
  #   2. AGGREGATING a panel's answers into one reply.
  # The `general` tag is excluded from panel seats entirely
  # (COMPOSE_EXCLUDED_DOMAINS) -- a generalist sitting next to a specialist in
  # that specialist's own lane is the Experiment 2 pairing that lost.

  - id: qwen3-8b
    display_name: Qwen3 8B
    source: "ollama:qwen3:8b"
    domain_tags: [general, conversation, writing, reasoning]
    capability_text: >
      Qwen3 8B. Strong general-purpose model — conversation, writing,
      summarisation and world knowledge, with solid general reasoning. The
      default aggregator: combining several specialists' replies needs breadth
      and instruction-following rather than depth in any one lane.
    params_b: 8.2
    min_ram_gb: 10
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: apache-2.0

  - id: gemma3-12b
    display_name: Gemma 3 12B
    source: "ollama:gemma3:12b"
    domain_tags: [general, conversation, writing]
    capability_text: >
      Gemma 3 12B. General-purpose model for everyday conversation, writing
      and world-knowledge questions. The heaviest generalist here — prefer it
      as an aggregator on a machine with room for it.
    params_b: 12.2
    min_ram_gb: 14
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: gemma

  - id: llama3.2-3b
    display_name: Llama 3.2 3B
    source: "ollama:llama3.2:3b"
    domain_tags: [general, conversation]
    capability_text: >
      Llama 3.2 3B. Small general-purpose model for conversation and everyday
      questions. The lightest entry in the catalogue — the fallback for a
      machine that cannot fit any specialist, so that an old laptop can still
      contribute rather than being turned away.
    params_b: 3.2
    min_ram_gb: 4
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: llama3.2
