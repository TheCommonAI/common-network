# Common Network specialist catalogue.
#
# This file is the SOURCE OF TRUTH for what the network will auto-install on
# a machine that runs `common join`. An entry removed from here is deleted
# from the gateway on next boot (see seed_catalogue_from_file) -- it is not
# merely hidden, so a node can never be assigned a model that isn't listed.
#
# This is a commons asset — PRs welcome. Add real, runnable models only.
# `source: ollama:*` tags were verified to resolve against registry.ollama.ai
# before being added; `gguf:URL#sha256` sources pin an exact file on Hugging
# Face, and common-join verifies the checksum after download, so a bad copy
# can never reach a node.
#
# `verified_in_lane: true` is earned by the benchmark harness (bench/)
# actually measuring a model beating a frontier model in its domain — never
# set it because a model "should" be good. See `lane_benchmark` for the
# measurement that earned it, and its `date`.
#
# min_ram_gb / min_vram_gb / needs_gpu gate what common-join will ever
# recommend for a given machine — leave real headroom, a specialist that
# swaps and times out is worse than a generalist that answers. The figures
# below are the measured download size plus room for KV cache and the OS;
# common-join additionally applies a 0.8 headroom factor on top.
#
# --- WHAT CHANGED IN 2026-10, AND WHY ------------------------------------
#
# The catalogue is now ONE model family at three footprints: prism-ml's
# Ternary Bonsai 2 (1.58-bit ternary weights, Apache-2.0, 262K-token cards,
# derived from the Qwen3.5 line). The v0.1.1 specialist mix below was retired
# in favour of it.
#
# Two hard constraints chose exactly these three entries, recorded so nobody
# has to re-litigate them:
#
#   1. Stock ggml-org llama.cpp — the runtime common-join fetches and every
#      node runs — loads Bonsai 2 ONLY in its upstream `Q2_0` packing, on
#      build b11555 or newer (which carries the Hadamard activation runtime;
#      older builds either reject the weights or, worse, load them and emit
#      gibberish). The smaller `PQ2_0`/`PTQ1_0` packings are rejected as
#      unknown types — those need PrismML's fork, which this network does
#      not ship. common-join always fetches the latest llama.cpp release,
#      so the b11555 floor needs no enforcement here, but DO NOT add a
#      catalogue entry in a non-Q2_0 packing.
#
#   2. The 27B Bonsai 2 ships no Q2_0 file at all, so the ladder stops at
#      9B. An 8GB-free machine can hold every entry here.
#
# Bonsai 2's cards default to "thinking mode": the model wants to emit a
# long chain of thought before answering. That is incompatible with the
# network's bounded replies (~1024 output tokens, 4096-token context) — a
# thinking preamble would eat the entire budget and leave nothing for the
# answer. The worker (join/worker.py) therefore stamps the card's
# non-thinking sampling on every request — temperature 0.7, top_p 0.8,
# top_k 20, presence_penalty 1.5, chat_template_kwargs.enable_thinking=false
# — as defaults the caller may override. If that stamp is ever removed,
# these entries must be reconsidered with it.
#
# What was traded away, honestly: specialist *lanes*. Seam-findings §2's
# finding stands — a panel of near-identical members cannot beat its own
# best node — and three sizes of one family are nearer-identical than the
# old mix. Composition (COMPOSE_EXCLUDED_DOMAINS, the gateway's panel
# machinery) simply has nothing distinct to seat until a verified specialist
# returns. CGLA-Legal below is exactly such a specialist, and the route back.
#
# --- WHAT CHANGED IN v0.1.1 (SUPERSEDED, KEPT FOR THE RECORD) ------------
#
# v0.1's catalogue was five general-purpose models and one API entry. Five
# generalists cannot compose: the whole finding of `testing/seam-findings.md`
# §2 is that combining models only pays when neither is dominated by the
# other, and near-identical generalists dominate each other by turns on noise.
# A catalogue of generalists guarantees the network can never beat its own
# best node, no matter how many machines join.
#
# So v0.1.1 was built around *narrow* specialists — models clearly worse than
# a generalist at most things and clearly better at one. The pre-flight in
# seam-findings.md §3 concluded no viable specialist pair existed, having
# searched all 411 OpenRouter model IDs and found zero maths-tuned models.
# That conclusion is true of OpenRouter and false of the actual world:
# `mathstral`, `phi4-mini-reasoning`, `sqlcoder`, `starcoder2`, `meditron`
# and `openthinker` all resolved on registry.ollama.ai at the time. Narrow
# specialists are unprofitable to host as a hosted API and free to host on
# donated hardware — which is the network's thesis, arriving as a practical
# consequence.

models:
  # --- Bonsai 2, three footprints ---------------------------------------
  #
  # One family, sized so every realistic donor machine holds a node: the 2B
  # is the floor (a machine with ~2GB spare), the 4B the default mid-tier,
  # the 9B the ceiling. Ternary weights make these far smaller on disk than
  # a conventional model of the same parameter count — the 9B's file is
  # ~2.4GB.

  - id: bonsai2-2b
    display_name: Bonsai 2 2B
    source: "gguf:https://huggingface.co/prism-ml/Ternary-Bonsai-2-2B-gguf/resolve/main/Ternary-Bonsai-2-2B-Q2_0.gguf#c2893fa6f951daee8b7263d5f49b455e57989ef56417a22125b03566dc560650"
    domain_tags: [general, conversation, writing]
    capability_text: >
      Bonsai 2 2B by prism-ml. Ternary (1.58-bit) general-purpose model
      derived from the Qwen3.5 line — conversation, writing, summarisation
      and everyday questions at a ~0.5GB download. The floor of the network:
      for a machine with almost nothing to spare, and still able to aggregate
      a panel's answers, which is the job a constrained machine is most
      useful for.
    params_b: 2.0
    min_ram_gb: 2
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: apache-2.0

  - id: bonsai2-4b
    display_name: Bonsai 2 4B
    source: "gguf:https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-gguf/resolve/main/Ternary-Bonsai-2-4B-Q2_0.gguf#64a5183b44921bdb5ac4a6f5f92007821d6ebe5c66997d3c147fd214ab9433d4"
    domain_tags: [general, conversation, writing]
    capability_text: >
      Bonsai 2 4B by prism-ml. Ternary (1.58-bit) general-purpose model
      derived from the Qwen3.5 line — conversation, writing, summarisation
      and world knowledge at a ~1.1GB download. The default mid-tier: the
      right answer for a machine that can spare a few GB but not 5.
    params_b: 4.0
    min_ram_gb: 3
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: apache-2.0

  - id: bonsai2-9b
    display_name: Bonsai 2 9B
    source: "gguf:https://huggingface.co/prism-ml/Ternary-Bonsai-2-9B-gguf/resolve/main/Ternary-Bonsai-2-9B-Q2_0.gguf#1f884aa56aacd2bbbb2e4b7abaead2b1102b74a9c75a23fc33dab916813a384d"
    domain_tags: [general, conversation, writing, reasoning]
    capability_text: >
      Bonsai 2 9B by prism-ml. Ternary (1.58-bit) general-purpose model
      derived from Qwen3.5-9B — conversation, writing, summarisation and
      world knowledge, with solid general reasoning, at a ~2.4GB download.
      The ceiling of the catalogue and the default aggregator: combining
      several nodes' replies needs breadth and instruction-following rather
      than depth in any one lane.
    params_b: 9.0
    min_ram_gb: 5
    min_vram_gb: 0
    needs_gpu: false
    verified_in_lane: false
    lane_benchmark: null
    licence: apache-2.0

